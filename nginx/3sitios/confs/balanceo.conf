events {
        worker_connections      1024;
}

pid logs/balanceo.pid;


http {
    upstream 3sitios{
        server 127.0.0.1:82;
        server 127.0.0.1:83;
        server 127.0.0.1:84;
    }
        server {
                listen 82;

                location / {
                        proxy_pass http://3sitios;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                }
        }
}
